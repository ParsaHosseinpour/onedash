name: CI

on:
  push:
    branches:
      - main
      - "phase-1/**"
      - "phase-2/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build without Supabase credentials
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  database:
    name: Database migrations, RLS tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations and seed
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Lint database functions
        run: supabase db lint --local --level warning

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
